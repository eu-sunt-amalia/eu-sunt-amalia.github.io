<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amalia — Portfolio</title>
<style>
:root{
  --bg:#e4e4e4;--bg2:#f4f4f4;--fg:#111;--mute:#5c5c5c;--btn:#111;--btnfg:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151515;--bg2:#232323;--fg:#f2f2f2;--mute:#9a9a9a;--btn:#f2f2f2;--btnfg:#111}}
:root[data-theme="dark"]{--bg:#151515;--bg2:#232323;--fg:#f2f2f2;--mute:#9a9a9a;--btn:#f2f2f2;--btnfg:#111}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;overflow:hidden;color:var(--fg);font-family:"Helvetica Neue",Inter,"Segoe UI",Arial,sans-serif;
  background:var(--bg) linear-gradient(115deg,transparent 30%,var(--bg2) 45%,transparent 60%) no-repeat;background-size:200% 100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,64px);z-index:5}
.logo{font-weight:700;font-size:22px;letter-spacing:-.02em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #3030d6;outline-offset:3px}

/* HOME */
#home{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:safe center;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;padding:calc(88px + env(safe-area-inset-top,0px)) clamp(20px,5vw,64px) calc(30px + env(safe-area-inset-bottom,0px));gap:clamp(18px,4vh,44px);transition:opacity .5s;z-index:1}
#home.dim h1,#home.dim p{opacity:0;transform:translateY(-16px)}
h1{margin:0;font-size:clamp(40px,6vw,84px);line-height:1.04;letter-spacing:-.04em;font-weight:600;transition:.6s}
#home p{margin:16px 0 0;font-size:clamp(16px,2vw,20px);color:var(--mute);max-width:46ch;line-height:1.5;transition:.6s}

/* WOODEN SHELF */
#shelf{position:relative;display:flex;flex-wrap:wrap;gap:clamp(14px,2.2vw,28px);padding-bottom:20px}
#shelf::before{content:"";position:absolute;left:-18px;right:-18px;bottom:20px;height:75%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.12));pointer-events:none}
#shelf::after{content:"";position:absolute;left:-18px;right:-18px;bottom:0;height:26px;border-radius:5px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 11px),linear-gradient(180deg,#e8c692 0,#e8c692 7px,#b98650 7px,#a5733f 65%,#85572e 100%);
  box-shadow:0 18px 26px -6px rgba(0,0,0,.45),inset 0 -2px 0 rgba(0,0,0,.28),inset 0 7px 0 rgba(255,255,255,.12)}

/* REALISTIC FOLDERS */
.folder{position:relative;width:min(205px,44vw);height:166px;border:0;background:none;padding:0;cursor:pointer;perspective:900px;z-index:1;
  transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .5s,translate .4s cubic-bezier(.2,.8,.2,1);animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes rise{from{transform:translateY(80px);opacity:0}}
.folder.away{transform:translateY(150px);opacity:0;pointer-events:none}
.folder.ghost{visibility:hidden}
.folder::after{content:"";position:absolute;left:5%;right:5%;bottom:-5px;height:12px;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(7px);z-index:0;transition:transform .5s,opacity .5s}
.tab{position:absolute;left:0;top:0;width:48%;height:44px;background:color-mix(in srgb,var(--c) 68%,#000);border-radius:16px 24px 0 0;z-index:0}
.bk{position:absolute;inset:28px 0 0;border-radius:6px 22px 22px 22px;z-index:0;background:color-mix(in srgb,var(--c) 68%,#000);box-shadow:0 8px 18px rgba(0,0,0,.25)}
.pk{position:absolute;left:14px;right:14px;top:12px;height:104px;background:#fff;border-radius:8px;z-index:2;transform:rotate(-3deg);box-shadow:0 1px 3px rgba(0,0,0,.28);
  background-image:repeating-linear-gradient(180deg,transparent 0 9px,rgba(0,0,0,.08) 9px 10px);background-position:0 14px;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.p2{background-color:#efece4;transform:rotate(2.5deg);left:22px;right:22px}
.p3{background-color:#f8f5ee;transform:rotate(-1deg);left:18px;right:18px;top:18px}
.fb{position:absolute;inset:54px 0 0;border-radius:4px 20px 22px 22px;background-color:var(--c);color:#fff;padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;z-index:3;
  transform-origin:50% 100%;transition:transform .55s cubic-bezier(.2,.8,.2,1),box-shadow .4s;
  background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 30%,rgba(0,0,0,.14));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.2),0 -2px 6px rgba(0,0,0,.14)}
.fb::before{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:rgba(255,255,255,.28)}
.fb::after{content:"";position:absolute;left:16px;top:16px;width:38%;height:15px;border-radius:3px;background:rgba(255,255,255,.88);box-shadow:inset 0 -1px 0 rgba(0,0,0,.14)}
.fb b{font-size:20px;font-weight:600;letter-spacing:-.01em}
.fb small{font-size:14px;opacity:.75;margin-top:2px}
.folder:active .fb{transform:rotateX(-12deg)}
@media (hover:hover){
  .folder:hover,.folder:focus-visible{translate:0 -4px}
  .folder:hover::after,.folder:focus-visible::after{transform:scale(.92);opacity:.7}
  .folder:hover .fb,.folder:focus-visible .fb{transform:rotateX(-26deg);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.2),0 0 34px color-mix(in srgb,var(--c) 70%,transparent)}
  .folder:hover .pk,.folder:focus-visible .pk{transform:translateY(-28px) rotate(-3deg)}
  .folder:hover .p2,.folder:focus-visible .p2{transform:translateY(-18px) rotate(2.5deg)}
  .folder:hover .p3,.folder:focus-visible .p3{transform:translateY(-9px) rotate(-1deg)}
}

/* STAGE */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:16px;padding:calc(84px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px));z-index:4;pointer-events:none;
  --pw:max(130px,min(340px,70vw,calc((100vh - 372px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))/1.32)));--ph:calc(var(--pw)*1.32)}
#stage[hidden]{display:none}
#stage>*{pointer-events:auto}
#back,#bar{opacity:0;transition:opacity .4s}
#stage.ctl #back,#stage.ctl #bar{opacity:1}
#back{align-self:flex-start;margin-left:calc((100vw - min(94vw,1080px))/2);border:0;background:none;font-size:15px;cursor:pointer;padding:10px 6px;color:var(--mute)}
#back:hover{color:var(--fg)}
#scene{position:relative;width:min(94vw,1080px);height:calc(var(--ph) + 150px);opacity:0;transition:transform .75s cubic-bezier(.7,0,.2,1),opacity .3s;perspective:1400px}
.back{position:absolute;inset:44px 0 0;background:var(--c);border-radius:6px 28px 28px 28px;z-index:1}
.back::before{content:"";position:absolute;left:0;top:-44px;width:240px;height:46px;background:var(--c);border-radius:20px 20px 0 0}
#track{position:absolute;inset:0;z-index:2;clip-path:inset(-400px -400px 0 -400px);touch-action:pan-y}
.front{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:5;border-radius:24px 24px 28px 28px;color:#fff;
  background:var(--c);box-shadow:inset 0 0 0 999px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,3vw,36px);
  opacity:0;transform-origin:50% 100%;transform:rotateX(-35deg);transition:opacity .3s,transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#stage.ready .front{opacity:1;transform:none}
.front>div{min-width:0}
.front b{display:block;font-size:clamp(22px,3.4vw,34px);letter-spacing:-.02em;font-weight:600;overflow-wrap:anywhere}
.front small{opacity:.75;font-size:14px}
.front span{font-size:13px;opacity:.7;text-align:right;max-width:20ch}
.paper{position:absolute;left:50%;bottom:76px;width:var(--pw);height:var(--ph);background:#fffefb;color:#161616;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 18px 40px rgba(0,0,0,.22),0 2px 4px rgba(0,0,0,.12);cursor:pointer;transform-origin:50% 100%;will-change:transform;
  transition:transform .85s cubic-bezier(.2,.8,.2,1),opacity .5s,filter .5s,box-shadow .5s;user-select:none}
.paper.sink{transition:transform .34s cubic-bezier(.55,0,.8,.4)}
.paper.cur{box-shadow:0 18px 40px rgba(0,0,0,.22),0 0 0 1px rgba(60,210,255,.5),0 0 38px rgba(40,200,255,.5)}
.shot{position:relative;flex:0 0 52%;border-radius:4px;overflow:hidden;background:#e8e6e0;border:1px solid #0001}
.shot .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:600;letter-spacing:-.03em;color:#0006;padding:12px;text-align:center}
.shot iframe{position:absolute;left:0;top:0;border:0;pointer-events:none;background:#fff;transform-origin:0 0}
.txt{display:flex;flex-direction:column;gap:6px;min-height:0;flex:1}
.txt h3{margin:0;font-size:19px;letter-spacing:-.02em}
.txt p{margin:0;font-size:13.5px;line-height:1.45;color:#555;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5}
.go{margin-top:auto;font-size:13px;font-weight:600;transition:transform .3s}
.paper.cur:hover .go{transform:translateX(4px)}
#bar{display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:15px;width:min(94vw,440px)}
#bar button{width:48px;height:48px;border-radius:50%;border:0;background:var(--btn);color:var(--btnfg);font-size:20px;cursor:pointer;transition:transform .2s,opacity .2s}
#bar button:hover:not(:disabled){transform:scale(1.08)}
#bar button:disabled{opacity:.3;cursor:default}
#bar span{flex:1;min-width:0;text-align:center;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{display:flex;align-items:center;gap:10px}
#lang{display:flex;padding:4px;border-radius:12px;border:1px solid color-mix(in srgb,var(--fg) 25%,transparent);background:none;cursor:pointer}
#lang span{padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mute);transition:background .3s,color .3s}
#lang span.on{background:var(--btn);color:var(--btnfg)}

/* BACKGROUND: soft blobs, drifting white dots, cursor glow */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.38;animation:drift 24s ease-in-out infinite alternate;will-change:transform}
.b1{width:460px;height:460px;left:4%;top:12%;background:#3fd0ff}
.b2{width:560px;height:560px;right:-4%;bottom:-6%;background:#6a6cff;animation-duration:30s;animation-delay:-8s}
.b3{width:360px;height:360px;left:44%;top:30%;background:#7af0ff;animation-duration:19s;animation-delay:-4s}
@keyframes drift{to{transform:translate(90px,-60px) scale(1.18)}}
#dots{position:absolute;inset:0;width:100%;height:100%}
#glow,#core{position:absolute;left:0;top:0;border-radius:50%;will-change:transform}
#glow{width:620px;height:620px;margin:-310px 0 0 -310px;background:radial-gradient(circle,rgba(0,215,255,.6) 0,rgba(0,170,255,.24) 35%,transparent 68%)}
#core{width:150px;height:150px;margin:-75px 0 0 -75px;background:radial-gradient(circle,rgba(190,250,255,.95) 0,rgba(60,220,255,.35) 45%,transparent 70%);filter:blur(8px);animation:breathe 3.2s ease-in-out infinite}
#glow.flash{animation:fl .7s ease-out}
@keyframes fl{35%{filter:brightness(1.9) saturate(1.5)}}
@keyframes breathe{50%{opacity:.65}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .blob,:root:not([data-theme="light"]) #glow,:root:not([data-theme="light"]) #core{mix-blend-mode:screen}}

.mini{position:absolute;inset:20px 24px 0}
.mini i{position:absolute;left:0;top:0;width:44%;height:26px;background:var(--c);border-radius:14px 14px 0 0}
.mini b{position:absolute;inset:22px 0 0;background:var(--c);border-radius:4px 18px 0 0;z-index:2}
.mini .pa,.mini .pb{position:absolute;left:12px;right:12px;top:10px;bottom:30px;background:#fff;border-radius:6px;transform:rotate(-3deg);z-index:1}
.mini .pb{background:#efece4;transform:rotate(2.5deg);left:20px;right:20px;top:4px}
.gal{position:absolute;inset:0;overflow:hidden;touch-action:pan-y}
.gt{display:flex;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.gt img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.gal.ct{background:#f4f3ee}.gal.ct img{object-fit:contain}
.gb{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:#000a;color:#fff;cursor:pointer;font-size:18px;line-height:1;opacity:0;transition:opacity .25s}
.gp{left:8px}.gn{right:8px}
.paper.cur:hover .gb{opacity:1}.paper:not(.cur) .gb{pointer-events:none}
@media (hover:none){.paper.cur .gb{opacity:.85}}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff9;box-shadow:0 0 3px #0006;transition:.3s}
.dots i.on{background:#fff;width:16px;border-radius:4px}
#lb{position:fixed;inset:0;z-index:20;background:rgba(5,10,20,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s;cursor:zoom-out}
#lb.on{opacity:1;pointer-events:auto}
#lb img{max-width:90vw;max-height:88vh;border-radius:6px;box-shadow:0 0 60px rgba(40,200,255,.35);grid-area:1/1}
.lbn{grid-area:1/1;align-self:center;width:46px;height:46px;border-radius:50%;border:0;background:#fff2;color:#fff;font-size:26px;cursor:pointer;z-index:1}
.lbn[hidden]{display:none}.lbn:first-child{justify-self:start;margin-left:16px}.lbn:last-child{justify-self:end;margin-right:16px}
*{-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{touch-action:manipulation}
.folder,.paper,button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#home{-webkit-overflow-scrolling:touch}
#home.dim{overflow:hidden}#home::-webkit-scrollbar{display:none}
@supports (height:100svh){#stage{--pw:max(130px,min(340px,70vw,calc((100svh - 372px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))/1.32)))}}
@media (pointer:coarse),(max-width:700px){.blob{filter:blur(44px);opacity:.3}#glow{width:420px;height:420px;margin:-210px 0 0 -210px}.blob,#glow,#core{mix-blend-mode:normal!important}}
@media (max-width:600px){
  .front span{display:none}
  #lang span{padding:8px 12px}
  h1{font-size:clamp(34px,10vw,48px)}
  #home p{font-size:15px;margin-top:10px}
  #shelf{gap:14px}
  .folder{width:calc((100% - 14px)/2);height:140px}
  .bk{inset:24px 0 0}
  .tab{height:38px}
  .pk{height:84px;top:10px}
  .p3{top:15px}
  .fb{inset:46px 0 0;padding:12px 14px}
  .fb::after{left:14px;top:14px}
  .fb b{font-size:17px}.fb small{font-size:12.5px}
  .front{height:96px}.front b{font-size:18px}
  .txt h3{font-size:17px}.txt p{font-size:13px;-webkit-line-clamp:4}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><canvas id="dots"></canvas><i id="glow"></i><i id="core"></i></div>
<header><div class="logo">Amalia.</div><div class="hr"><button id="lang" type="button" aria-label="Language / Limbă"><span data-l="ro">RO</span><span data-l="en">EN</span></button></div></header>

<main id="home">
  <div>
    <h1>Hi, I’m Amalia.<br>Open a folder.</h1>
    <p>Everything I’ve made and loved, filed on one shelf: who I am, the work I ship, and the pictures I take.</p>
  </div>
  <div id="shelf"></div>
</main>

<section id="stage" hidden>
  <button id="back" type="button">← Back to the shelf</button>
  <div id="scene">
    <div class="back"></div>
    <div id="track"></div>
    <div class="front"><div><b id="fname"></b><small id="fmeta"></small></div><span>Scroll, swipe or use the arrow keys</span></div>
  </div>
  <div id="bar">
    <button id="prev" type="button" aria-label="Previous file">←</button>
    <span id="count"></span>
    <button id="next" type="button" aria-label="Next file">→</button>
  </div>
</section>

<div id="lb" role="dialog" aria-label="Image"><button class="lbn" data-d="-1" type="button" aria-label="Previous">‹</button><img alt=""><button class="lbn" data-d="1" type="button" aria-label="Next">›</button></div>
<script>


const DATA = [
  { name:"About Me", color:"#d65d3b", files:[
    { title:"Bio", desc:"I’m Amalia, 16 years old, and I study at Colegiul Mihai Eminescu in Bacău. I love flowers and cars, and I enjoy learning new things every day.", url:null },
    { title:"WhatsApp", desc:"Message me on WhatsApp.", url:"https://wa.me/40750250214" },
    { title:"Instagram", desc:"Follow me on Instagram.", url:"https://instagram.com/atyloves_art" },
    { title:"Email", desc:"Send me an email.", url:"mailto:amaliwaaa@email.com" },
    { title:"Resume", desc:"Experience, education and the tools I use every day.", url:null },
    { title:"My Photos", desc:"A few pictures of me.", imgs:[
      "poze-about/1.jpg",
      "poze-about/2.jpg",
      "poze-about/3.jpg"
    ]}
  ]},
  { name:"My Skills", color:"#14917f", files:[
    { title:"Language Skills", desc:"Language certificates and levels.", sub:[
      { title:"Cambridge Diploma", desc:"I passed the Cambridge English C1 Diploma with an overall score of 188.", imgs:["poze-skills/cambridge.jpg"], fit:"contain" }
    ]},
    { title:"Digital Skills", desc:"Digital certificates, including ECDL.", sub:[
      { title:"ECDL Excel Certificate", desc:"Was not fun at all.", imgs:["poze-skills/ecdl-excel.jpg"], fit:"contain" },
      { title:"ECDL Diploma 2", desc:"My second ECDL diploma.", imgs:["poze-skills/ecdl-2.jpg"], fit:"contain" }
    ]}
  ]},
  { name:"Competitions", color:"#7b3fe4", files:[
    { title:"National ICT Olympiad", desc:"I competed at the National ICT Olympiad, where I won 2nd place at county level and ranked 389th nationally out of about 90 (per the official results).", imgs:[
      "poze-competitions/olimpiada-1.jpg",
      "poze-competitions/olimpiada-2.jpg",
      "poze-competitions/olimpiada-3.jpg"
    ]},
    { title:"Innovation Day", desc:"I took part in iInnovation Day.", imgs:[
      "poze-competitions/iinnovation-1.jpg",
      "poze-competitions/iinnovation-2.jpg",
      "poze-competitions/iinnovation-3.jpg"
    ]},
    { title:"Story Rewriting Workshop", desc:"I attended a workshop on rewriting stories.", imgs:[
      "poze-competitions/atelier-1.jpg",
      "poze-competitions/atelier-2.jpg",
      "poze-competitions/atelier-3.jpg"
    ]},
    { title:"National Public Speaking", desc:"I took part in the National Public Speaking competition.", imgs:[
      "poze-competitions/speaking-1.jpg",
      "poze-competitions/speaking-2.jpg",
      "poze-competitions/speaking-3.jpg"
    ]}
  ]},
  { name:"My Work", color:"#2f2fd0", files:[
    { title:"PrintExpress Bacău", desc:"My favourite library that is near my college.", url:"https://print-expresss.github.io/" },
    { title:"Magic Candles", desc:"The most beautiful scented candles.", url:"https://magiccandles.github.io/" },
    { title:"Anti drug", desc:"A website created for a competition, with the goal of promoting the management of addictions.", url:"https://anti-drog.github.io/" }
  ]},
  { name:"Photography & Hobbies", color:"#b79d7c", files:[
    { title:"Flowers", desc:"Photos of flowers I love.", imgs:[
      "poze-hobbies/flori-1.jpg",
      "poze-hobbies/flori-2.jpg",
      "poze-hobbies/flori-3.jpg"
    ]},
    { title:"Cars", desc:"Photos of cars I like.", imgs:[
      "poze-hobbies/masini-1.jpg",
      "poze-hobbies/masini-2.jpg",
      "poze-hobbies/masini-3.jpg"
    ]}
  ]}
];
/* ================================================ */

const $ = s => document.querySelector(s);
const home=$('#home'), shelf=$('#shelf'), stage=$('#stage'), scene=$('#scene'), track=$('#track');
const pad = n => String(n).padStart(2,'0');
let cur=0, files=[], papers=[], up=false, busy=false, lock=false, openIdx=null, openBtn=null, lastWheel=0;

/* ---------- Romanian translations (key = English title / name) ---------- */
const RO_F = {"My Skills":"Competențele mele","Competitions":"Concursuri","About Me":"Despre mine","My Work":"Munca mea","Photography & Hobbies":"Fotografie și hobby-uri"};
const RO = {
  "Language Skills":["Competențe lingvistice","Certificate și niveluri de limbă."],
  "Digital Skills":["Competențe digitale","Certificate digitale, inclusiv ECDL."],
  "Cambridge Diploma":["Diploma Cambridge","Am obținut diploma Cambridge English C1 cu scorul general 188."],
  "ECDL Excel Certificate":["Certificat ECDL Excel","Nu a fost deloc distractiv."],
  "ECDL Diploma 2":["Diploma ECDL 2","A doua mea diplomă ECDL."],
  "National ICT Olympiad":["Olimpiada Națională de TIC","Am participat la Olimpiada Națională de TIC, unde am obținut locul 2 pe județ și m-am clasat pe locul 389 la nivel național, din aproximativ 90 (conform rezultatelor oficiale)."],
  "Innovation Day":["iInnovation Day","Am participat la iInnovation Day."],
  "Story Rewriting Workshop":["Atelier de rescris povești","Am participat la concursul Atelier de rescris povești."],
  "National Public Speaking":["Concurs Național de Public Speaking","Am participat la concursul național de public speaking."],
  "Bio":["Bio","Sunt Amalia, am 16 ani și studiez la Colegiul Mihai Eminescu din Bacău. Îmi plac florile și mașinile și îmi place să învăț lucruri noi în fiecare zi."],
  "WhatsApp":["WhatsApp","Scrie-mi pe WhatsApp."],
  "Instagram":["Instagram","Urmărește-mă pe Instagram."],
  "Email":["Email","Trimite-mi un e-mail."],
  "Resume":["CV","Sunt și voluntară la FSC."],
  "My Photos":["Pozele mele","Câteva poze cu mine."],
  "PrintExpress Bacău":["PrintExpress Bacău","Librăria mea favorită de lângă gară."],
  "Magic Candles":["Magic Candles","Cele mai frumoase lumânări parfumate."],
  "Anti drug":["Anti drog","Un site realizat pentru un concurs cu scopul de a promova controlarea adicțiilor."],
  "Flowers":["Flori","Poze cu flori care îmi plac."],
  "Cars":["Mașini","Poze cu mașini care îmi plac."]
};
const UI = {
  en:{title:'Amalia — Portfolio',h1:'Hi, I’m Amalia.<br>Open a folder.',sub:'Everything I’ve made and loved, filed on one shelf: who I am, the work I ship, and the pictures I take.',mail:'Say hello',back:'← Back to the shelf',hint:'Scroll, swipe or use the arrow keys',prev:'Previous file',next:'Next file',open:'Open folder',sorted:', A to Z',visit:'Visit',email:'Send an email',preview:'Preview of',openf:'Open folder',backup:'← Back',zoom:'Enlarge'},
  ro:{title:'Amalia — Portofoliu',h1:'Salut, sunt Amalia.<br>Deschide un dosar.',sub:'Tot ce am creat și iubit, pe o singură pagină: cine sunt, proiectele la care lucrez și pozele pe care le fac.',mail:'Scrie-mi',back:'← Înapoi la raft',hint:'Derulează, trage sau folosește săgețile',prev:'Fișierul anterior',next:'Fișierul următor',open:'Deschide dosarul',sorted:', de la A la Z',visit:'Vizitează',email:'Trimite un e-mail',preview:'Previzualizare',openf:'Deschide dosarul',backup:'← Înapoi',zoom:'Mărește'}
};
let lang='en';
try{ lang=localStorage.getItem('lang')||''; }catch(e){}
if(lang!=='ro' && lang!=='en') lang=(navigator.language||'').toLowerCase().startsWith('ro')?'ro':'en';
const T = k => UI[lang][k];
const nf = n => lang==='ro' ? n+(n===1?' fișier':' fișiere') : n+(n===1?' file':' files');
const tn = f => (lang==='ro' && RO_F[f.name]) || f.name;
const tf = file => { const r = lang==='ro' && RO[file.title]; return {title:r?r[0]:file.title, desc:r?r[1]:file.desc}; };
const sorted = n => (n.files||n.sub).slice().sort((a,b) => tf(a).title.localeCompare(tf(b).title, lang));

let stack=[];
const lite = matchMedia('(pointer:coarse)').matches || innerWidth < 700;
const crumb = () => stack.map((n,k) => k ? tf(n).title : tn(n)).join(' › ');
function act(file,p){
  if(p._swiped) return;
  if(file.sub){ nav(() => stack.push(file)); return; }
  if(file.url){ visit(file); return; }
  if(file.imgs) lightbox(file.imgs, p._gi||0);
}
function nav(fn,keep){
  if(busy || lock || !up || openIdx===null) return;
  lock=true; up=false; layout(-1,true);            // files sink, the next level rises
  setTimeout(() => {
    if(busy || openIdx===null){ lock=false; return; }
    fn(); build(stack[stack.length-1], keep); fit(); settle();
    up=true; layout(-1,true);
    setTimeout(() => lock=false, 900);
  }, 700);
}
function goBack(){
  if(stack.length>1){ const t=stack[stack.length-1]; nav(() => stack.pop(), t); } else closeFolder();
}
let lbSet=[], lbI=0;
function lightbox(imgs,i){
  lbSet=imgs; lbI=i; $('#lb img').src=imgs[i];
  document.querySelectorAll('.lbn').forEach(b => b.hidden=imgs.length<2);
  $('#lb').classList.add('on');
}
function lbMove(d){ lbI=(lbI+d+lbSet.length)%lbSet.length; $('#lb img').src=lbSet[lbI]; }
function buildGal(p,file){
  const n=file.imgs.length, s=p.querySelector('.shot');
  s.innerHTML = `<div class="gal ${file.fit==='contain'?'ct':''}"><div class="gt">${file.imgs.map(u => `<img src="${u}" alt="" draggable="false">`).join('')}</div>${n>1?`<button class="gb gp" type="button" aria-label="Previous photo">‹</button><button class="gb gn" type="button" aria-label="Next photo">›</button><div class="dots">${file.imgs.map(() => '<i></i>').join('')}</div>`:''}</div>`;
  p._gi=0; p._gn=n; p._gpause=0;
  const set = i => { p._gi=(i+n)%n; p.querySelector('.gt').style.transform=`translateX(${-100*p._gi}%)`; p.querySelectorAll('.dots i').forEach((d,k) => d.classList.toggle('on',k===p._gi)); };
  p._gset=set; set(0);
  if(n>1){
    const hold = () => p._gpause=Date.now()+7000;
    p.querySelector('.gp').onclick = e => { e.stopPropagation(); hold(); set(p._gi-1); };
    p.querySelector('.gn').onclick = e => { e.stopPropagation(); hold(); set(p._gi+1); };
    let x0=null; const g=p.querySelector('.gal');
    g.addEventListener('pointerdown', e => x0=e.clientX);
    g.addEventListener('pointerup', e => {
      if(x0!==null && p.classList.contains('cur') && Math.abs(e.clientX-x0)>40){ hold(); set(p._gi+(e.clientX<x0?1:-1)); p._swiped=1; setTimeout(() => p._swiped=0, 60); }
      x0=null;
    });
  }
}
function settle(){
  papers.forEach(p => p.style.transition='none'); layout(); void track.offsetWidth; papers.forEach(p => p.style.transition='');
}
function setLang(l){
  lang=l; try{ localStorage.setItem('lang',l); }catch(e){}
  document.documentElement.lang=l; document.title=T('title');
  $('h1').innerHTML=T('h1'); $('#home p').textContent=T('sub');
  $('#back').textContent=T('back'); $('.front span').textContent=T('hint');
  $('#prev').setAttribute('aria-label',T('prev')); $('#next').setAttribute('aria-label',T('next'));
  document.querySelectorAll('#lang span').forEach(s => s.classList.toggle('on', s.dataset.l===l));
  [...shelf.children].forEach((b,i) => {
    b.querySelector('b').textContent=tn(DATA[i]); b.querySelector('small').textContent=nf(DATA[i].files.length);
    b.setAttribute('aria-label',T('open')+' '+tn(DATA[i]));
  });
  if(openIdx!==null) relang();
}
function relang(n=0){
  if(openIdx===null || n>8) return;
  if(!up || busy || lock) return setTimeout(() => relang(n+1), 400);
  lock=true; const keep=files[cur];
  up=false; layout(-1,true);                       // files sink, then come back in the new language
  setTimeout(() => {
    if(busy || openIdx===null){ lock=false; return; }
    build(stack[stack.length-1], keep); fit(); settle();
    up=true; layout(-1,true);
    setTimeout(() => lock=false, 900);
  }, 700);
}

DATA.forEach((f,i) => {
  const b = document.createElement('button');
  b.className='folder'; b.type='button';
  b.style.setProperty('--c', f.color); b.style.setProperty('--d', i*90+'ms');
  /* labels are set in setLang */
  b.innerHTML = `<i class="tab"></i><span class="bk"></span><span class="pk"></span><span class="pk p2"></span><span class="pk p3"></span><span class="fb"><b></b><small></small></span>`;
  b.onclick = () => openFolder(i,b);
  shelf.append(b);
});

function domain(u){ try{ return new URL(u).hostname.replace('www.',''); }catch(e){ return ''; } }

function build(node,keep){
  const f = DATA[openIdx]; files = sorted(node); cur = keep ? Math.max(0,files.indexOf(keep)) : 0; up = false;
  scene.style.setProperty('--c', f.color);
  $('#fname').textContent = crumb();
  $('#fmeta').textContent = nf(files.length)+T('sorted');
  $('#back').textContent = stack.length>1 ? T('backup') : T('back');
  track.innerHTML = '';
  papers = files.map((file,k) => {
    const p = document.createElement('article');
    p.className='paper';
    const web = file.url && file.url.startsWith('http'); const x = tf(file);
    p.innerHTML = `<div class="shot"><div class="ph">${web?domain(file.url):x.title}</div>${web?`<iframe data-src="${file.url}" title="${T('preview')} ${x.title}" tabindex="-1" loading="lazy" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin"></iframe>`:''}</div>
      <div class="txt"><h3>${x.title}</h3><p>${x.desc}</p>${file.url?`<span class="go">${file.url.startsWith('mailto')?T('email'):T('visit')+' '+domain(file.url)} ↗</span>`:''}</div>`;
    if(file.sub){
      p.classList.add('isfolder');
      p.querySelector('.shot').innerHTML = `<div class="mini" style="--c:${f.color}"><i></i><span class="pa"></span><span class="pb"></span><b></b></div>`;
      p.querySelector('.txt').insertAdjacentHTML('beforeend', `<span class="go">${nf(file.sub.length)} · ${T('openf')} ↗</span>`);
    } else if(file.imgs){
      buildGal(p,file);
      if(!file.url) p.querySelector('.txt').insertAdjacentHTML('beforeend', `<span class="go">${T('zoom')} ⤢</span>`);
    }
    p.onclick = () => k===cur ? act(file,p) : go(k);
    track.append(p);
    return p;
  });
}

function visit(file){
  if(!file.url) return;
  if(file.url.startsWith('mailto')) location.href=file.url; else window.open(file.url,'_blank','noopener');
}

function fit(){
  papers.forEach(p => {
    const s = p.querySelector('.shot'), fr = p.querySelector('iframe'); if(!fr) return;
    const k = s.clientWidth/1280;
    fr.style.width='1280px'; fr.style.height=(s.clientHeight/k)+'px'; fr.style.transform=`scale(${k})`;
  });
}

function loadNear(){
  (lite ? (up?[cur]:[]) : [cur-1,cur,cur+1]).forEach(k => { const fr = papers[k] && papers[k].querySelector('iframe'); if(fr && !fr.src) fr.src = fr.dataset.src; });
}

function layout(sink=-1, stagger=false){
  const pw = papers[0].offsetWidth;
  papers.forEach((p,i) => {
    const d=i-cur, a=Math.abs(d);
    const x=d*pw*.56, y=(up && i!==sink)? a*20 : pw*1.7, r=d*3.5, s=1-a*.07;
    p.style.transitionDelay = stagger ? a*80+'ms' : '0ms';
    p.style.transform = `translateX(calc(-50% + ${x}px)) translateY(${y}px) rotate(${r}deg) scale(${s})`;
    p.style.zIndex = 50-a; p.style.opacity = a>2?0:1;
    p.style.filter = (a && !lite) ? `brightness(${1-a*.07})` : 'none';
    p.classList.toggle('cur', !d);
  });
  $('#count').textContent = pad(cur+1)+' / '+pad(files.length)+'  ·  '+files[cur].title;
  $('#prev').disabled = cur===0; $('#next').disabled = cur===files.length-1;
  loadNear();
}

function go(n){
  if(!up || lock || n<0 || n>=files.length || n===cur) return;
  lock = true;
  const old = papers[cur];
  old.classList.add('sink'); layout(cur);          // current file is put back into the folder
  setTimeout(() => { old.classList.remove('sink'); cur=n; layout(); lock=false; }, 340);   // then the stack scrolls
}

function flipTo(r){
  const s = scene.getBoundingClientRect();
  return `translate(${r.left+r.width/2-(s.left+s.width/2)}px,${r.top+r.height/2-(s.top+s.height/2)}px) scale(${r.width/s.width},${r.height/s.height})`;
}

function openFolder(i,b){
  if(busy) return; busy=true; openIdx=i; openBtn=b;
  stage.hidden=false; stack=[DATA[i]]; build(DATA[i]); fit(); settle();
  const r = b.getBoundingClientRect();
  scene.style.transition='none'; scene.style.transform='none'; scene.style.opacity='0';
  scene.style.transform = flipTo(r); void scene.offsetWidth;
  scene.style.transition=''; scene.style.opacity='1'; scene.style.transform='none';
  home.classList.add('dim'); b.classList.add('ghost');
  [...shelf.children].forEach(c => { if(c!==b) c.classList.add('away'); });
  setTimeout(() => {
    stage.classList.add('ready','ctl'); up=true; layout(-1,true);
    setTimeout(() => busy=false, 900);
  }, 720);
}

function closeFolder(){
  if(busy || lock || openIdx===null) return; busy=true;
  stage.classList.remove('ctl'); up=false; layout(-1,true);       // files go back into the folder
  setTimeout(() => {
    stage.classList.remove('ready');
    const r = openBtn.getBoundingClientRect();
    scene.style.transform = flipTo(r); scene.style.opacity='0';   // folder returns to the shelf
    [...shelf.children].forEach(c => c.classList.remove('away'));
    home.classList.remove('dim');
    setTimeout(() => {
      openBtn.classList.remove('ghost'); stage.hidden=true;
      scene.style.transition='none'; scene.style.transform='none'; void scene.offsetWidth; scene.style.transition='';
      openIdx=null; busy=false;
    }, 650);
  }, 900);
}

$('#back').onclick = goBack;
$('#prev').onclick = () => go(cur-1);
$('#next').onclick = () => go(cur+1);
addEventListener('keydown', e => {
  if($('#lb').classList.contains('on')){
    if(e.key==='Escape') $('#lb').classList.remove('on');
    if(e.key==='ArrowRight') lbMove(1);
    if(e.key==='ArrowLeft') lbMove(-1);
    return;
  }
  if(openIdx===null) return;
  if(e.key==='Escape') goBack();
  if(e.key==='ArrowRight') go(cur+1);
  if(e.key==='ArrowLeft') go(cur-1);
});
stage.addEventListener('wheel', e => {
  const d = Math.abs(e.deltaX)>Math.abs(e.deltaY)? e.deltaX : e.deltaY;
  if(Math.abs(d)<20 || Date.now()-lastWheel<650) return;
  lastWheel=Date.now(); go(cur+(d>0?1:-1));
},{passive:true});
let sx=null;
track.addEventListener('pointerdown', e => { sx = e.target.closest('.gal') ? null : e.clientX; });
$('#lb').onclick = e => { const b=e.target.closest('.lbn'); if(b){ lbMove(+b.dataset.d); return; } $('#lb').classList.remove('on'); };
addEventListener('pointerup', e => { if(sx!==null && Math.abs(e.clientX-sx)>50) go(cur+(e.clientX<sx?1:-1)); sx=null; });
let lw=innerWidth;
addEventListener('resize', () => { if(innerWidth===lw) return; lw=innerWidth; if(openIdx!==null){ fit(); layout(); } });
addEventListener('pointercancel', () => { sx=null; });
$('#lang').onclick = () => setLang(lang==='ro' ? 'en' : 'ro');
setLang(lang);

/* ---------- neon cursor glow ---------- */
const glow=$('#glow'), core=$('#core'), rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let mx=innerWidth/2, my=innerHeight/2, gx=mx, gy=my, cx=mx, cy=my;
addEventListener('pointermove', e => { mx=e.clientX; my=e.clientY; kick(); });
addEventListener('pointerdown', e => { mx=e.clientX; my=e.clientY; glow.classList.remove('flash'); void glow.offsetWidth; glow.classList.add('flash'); kick(); });
setInterval(() => {   // photo galleries scroll by themselves, and pause after a manual move
  if(rm || document.hidden || openIdx===null || !up) return;
  papers.forEach(p => { if(p._gn>1 && Date.now()>p._gpause && !p.matches(':hover')) p._gset(p._gi+1); });
}, 3200);
let raf=0;
function tick(){
  const k=rm?1:.07, k2=rm?1:.2;
  gx+=(mx-gx)*k; gy+=(my-gy)*k; cx+=(mx-cx)*k2; cy+=(my-cy)*k2;
  glow.style.transform=`translate(${gx}px,${gy}px)`; core.style.transform=`translate(${cx}px,${cy}px)`;
  raf = (Math.abs(mx-gx)+Math.abs(my-gy)+Math.abs(mx-cx)+Math.abs(my-cy) > .6) ? requestAnimationFrame(tick) : 0;
}
function kick(){ if(!raf) raf=requestAnimationFrame(tick); }
kick();

/* ---------- slowly drifting white dots ---------- */
(() => {
  const c = $('#dots'), g = c.getContext('2d');
  let w = 0, h = 0, P = [];
  const mk = () => ({
    x: Math.random()*innerWidth, y: Math.random()*innerHeight,
    r: .8 + Math.random()*2.2,
    vx: (Math.random()-.5)*.22, vy: (Math.random()-.5)*.22 - .04,
    ph: Math.random()*6.28, sp: .5 + Math.random()
  });
  function size(){
    const d = Math.min(devicePixelRatio||1, 2);
    w = innerWidth; h = innerHeight;
    c.width = w*d; c.height = h*d; g.setTransform(d,0,0,d,0,0);
    const n = Math.round(Math.min(lite ? 45 : 110, w*h/13000));
    while(P.length < n) P.push(mk());
    P.length = n;
    if(rm) draw(0);
  }
  function draw(t){
    g.clearRect(0,0,w,h);
    g.fillStyle = '#fff';
    if(!lite){ g.shadowColor = 'rgba(0,150,255,.6)'; g.shadowBlur = 8; }
    for(const p of P){
      if(!rm){
        const dx = p.x-mx, dy = p.y-my, d2 = dx*dx+dy*dy;
        if(d2 < 20000 && d2 > 1){ const f = .5/Math.sqrt(d2); p.x += dx*f; p.y += dy*f; }   // gently avoid the cursor
        p.x += p.vx; p.y += p.vy;
        if(p.x < -6) p.x = w+6;
        if(p.x > w+6) p.x = -6;
        if(p.y < -6) p.y = h+6;
        if(p.y > h+6) p.y = -6;
      }
      g.globalAlpha = .4 + .45*Math.pow(Math.sin(t/1000*p.sp + p.ph), 2);
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.2832); g.fill();
    }
    g.globalAlpha = 1;
  }
  const loop = t => { if(!document.hidden) draw(t); requestAnimationFrame(loop); };
  addEventListener('resize', size);
  size();
  if(!rm) requestAnimationFrame(loop);
})();
</script>
</body>
